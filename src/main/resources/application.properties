# Configuración del servidor y puerto de la aplicación
server.port=8080

# Conexión a tu base de datos MySQL local
spring.datasource.url=jdbc:mysql://localhost:3306/products_inventory?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Configuración de Hibernate / JPA para la base de datos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
